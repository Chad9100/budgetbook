[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetbook"
version = "0.1.0"
description = "A small local personal-finance web app: transactions, CSV import, rules, budgets and monthly reports (Flask + SQLite)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chad Mowlavie" }]
keywords = ["budget", "finance", "money", "flask", "sqlite"]
classifiers = [
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["flask>=2.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
budgetbook = "budgetbook.cli:main"

[project.urls]
Homepage = "https://github.com/Chad9100/budgetbook"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budgetbook = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
